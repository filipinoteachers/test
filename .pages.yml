media:
  - name: images
    label: Images
    input: assets/media/
    output: /

content:
  - name: blog
    label: Blog
    type: collection
    path: content/blog
    format: yaml-frontmatter
    filename: "{primary}/index.md"

    fields:
      - name: title
        label: Title
        type: string

      - name: summary
        label: Summary
        type: string

      - name: date
        label: Date
        type: date

      - name: lastmod
        label: Last Modified
        type: date

      - name: tags
        label: Tags
        type: string
        list: true

      - name: authors
        label: authors
        type: string
        list: true
        default: me

      - name: draft
        label: Draft
        type: boolean
        default: true

      - name: featured
        label: Featured
        type: boolean
        default: false

      - name: image
        type: object
        fields:
          - name: filename
            type: image
            options:
              media: images
              path: blog
          - name: focal_point
            type: string
            default: Smart
          - name: preview_only
            type: boolean
            default: true
          - name: alt_text
            type: string
            default: Alt Text

      - name: cover
        type: object
        fields:
          - name: image
            type: image
            options:
              media: images
              path: blog
          - name: alt_text
            type: string
            default: Alt Text
          - name: style
            type: string
            default: gradient
          - name: height
            type: string
            default: full
          - name: hidden
            type: boolean
            default: false
          - name: position
            type: object
            fields:
              - name: x
                type: number
                default: 50
                options:
                  min: 0
                  max: 100
              - name: y
                type: number
                default: 50
                options:
                  min: 0
                  max: 100
          - name: fade
            type: object
            fields:
              - name: enabled
                type: boolean
                default: true
          - name: overlay
            type: object
            fields:
              - name: color
                type: text
                default: "#000000"
              - name: opacity
                type: number
                default: 0.3
          
      - name: body
        label: Content
        type: rich-text

content:
  - name: me
    label: Author Data
    type: file
    path: /data/authors/test.yaml
    fields:
      - name: schema
        type: string
        default: hugoblox/author/v1
        hidden: true
      - name: slug
        label: Slug
        type: string
        default: me
      - name: is_owner
        label: "Are you the owner of this site?"
        type: boolean
        default: true
      - name: name
        label: "What's your name?"
        type: object
        fields:
          - name: display
            label: "Display Name e.g. Jose Rizal"
            type: string
          - name: given
            label: Given Name
            type: string
          - name: family
            label: Family Name
            type: string
          # - name: alternate
          #   type: string
          - name: pronunciation
            label: "Pronunciation e.g ho-SEH ree-SAL"
            type: string
          - name: pronouns
            label: Pronouns
            type: string
      - name: postnominals
        label: Postnominals
        type: string
        list: true
      - name: status
        label: Status
        type: object
        fields:
          - name: icon
            type: string
            default: "☕️"
      - name: role
        label: Role
        type: string
        default: Professional teacher
      - name: bio
        label: Bio
        type: text

      - name: affiliations
        label: Affiliations
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: url
            label: URL
            type: string

      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: icon
            label: Icon
            type: string
          - name: url
            label: URL
            type: string
          - name: label
            label: Label
            type: string

      - name: interests
        label: Interests
        type: string
        list: true

      - name: education
        label: Education
        type: object
        list: true
        fields:
          - name: degree
            label: Degree
            type: string
          - name: institution
            label: Institution
            type: string
          - name: start
            label: Start
            type: date
          - name: end
            label: End
            type: date
          - name: summary
            label: Summary
            type: text
          - name: button
            label: Button
            type: object
            fields:
              - name: text
                label: Text
                type: string
                default: Download my resume
              - name: url
                label: URL
                type: string
                default: /resume.pdf
              - name: icon
                label: Icon
                type: string
                default: hero/arrow-down-tray

      - name: experience
        label: Experience
        type: object
        list: true
        fields:
          - name: role
            label: Role
            type: string
          - name: org
            label: Organization
            type: string
          - name: start
            label: Start
            type: date
          - name: summary
            label: Summary
            type: text
          - name: button
            label: Button
            type: object
            fields:
              - name: text
                label: Text
                type: string
                default: View portfolio
              - name: url
                label: URL
                type: string
                default: "/"
              - name: icon
                label: Icon
                type: string
                default: hero/arrow-down-tray

      - name: skills
        label: Skills
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: items
            label: Items
            type: object
            list: true
            fields:
              - name: label
                label: Label
                type: string
              - name: level
                label: Level
                type: number
                options:
                  min: 0
                  max: 5

      - name: languages
        label: Languages
        type: object
        list: true
        fields:
          - name: name
            label: Language
            type: string
          - name: level
            label: Level
            type: number
            options:
              min: 0
              max: 5
          - name: label
            label: Label
            type: string

      - name: awards
        label: Awards
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: awarder
            label: Awarder
            type: string
          - name: date
            label: Date
            type: date
          - name: summary
            label: Summary
            type: string
          - name: icon
            label: Icon
            type: string
