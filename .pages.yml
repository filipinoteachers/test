media:
  input: assets/media
  output: /
content:
  - name: me
    label: Author Data
    type: file
    path: /data/authors/test.yaml
    fields:
      - name: schema
        type: string
        default: hugoblox/author/v1
        hidden: true
      - name: slug
        label: Slug
        type: string
        default: me
      - name: is_owner
        label: "Are you the owner of this site?"
        type: boolean
        default: true
      - name: name
        label: "What's your name?"
        type: object
        fields:
          - name: display
            type: string
          - name: given
            type: string
          - name: family
            type: string
          # - name: alternate
          #   type: string
          - name: pronunciation
            type: string
          - name: pronouns
            type: string
      - name: postnominals
        label: Postnominals
        type: string
        list: true
      - name: status
        label: Status
        type: object
        fields:
          - name: icon
            type: string
            default: "☕️"
      - name: role
        label: Role
        type: string
        default: Professional teacher
      - name: bio
        label: Bio
        type: text

      - name: affiliations
        label: Affiliations
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: url
            label: URL
            type: string

      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: icon
            label: Icon
            type: string
          - name: url
            label: URL
            type: string
          - name: label
            label: Label
            type: string

      - name: interests
        label: Interests
        type: string
        list: true

      - name: education
        label: Education
        type: object
        list: true
        fields:
          - name: degree
            label: Degree
            type: string
          - name: institution
            label: Institution
            type: string
          - name: start
            label: Start
            type: date
          - name: end
            label: End
            type: date
          - name: summary
            label: Summary
            type: text
          - name: button
            label: Button
            type: object
            fields:
              - name: text
                label: Text
                type: string
                default: Download my resume
              - name: url
                label: URL
                type: string
                default: /resume.pdf
              - name: icon
                label: Icon
                type: string
                default: hero/arrow-down-tray

      - name: experience
        label: Experience
        type: object
        list: true
        fields:
          - name: role
            label: Role
            type: string
          - name: org
            label: Organization
            type: string
          - name: start
            label: Start
            type: date
          - name: summary
            label: Summary
            type: text
          - name: button
            label: Button
            type: object
            fields:
              - name: text
                label: Text
                type: string
                default: View portfolio
              - name: url
                label: URL
                type: string
                default: "/"
              - name: icon
                label: Icon
                type: string
                default: hero/arrow-down-tray

      - name: skills
        label: Skills
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: items
            label: Items
            type: object
            list: true
            fields:
              - name: label
                label: Label
                type: string
              - name: level
                label: Level
                type: number

      - name: languages
        label: Languages
        type: object
        list: true
        fields:
          - name: name
            label: Language
            type: string
          - name: level
            label: Level
            type: number
          - name: label
            label: Label
            type: string

      - name: awards
        label: Awards
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: awarder
            label: Awarder
            type: string
          - name: date
            label: Date
            type: date
          - name: summary
            label: Summary
            type: string
          - name: icon
            label: Icon
            type: string